services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: idea_os
      POSTGRES_PASSWORD: idea_os
      POSTGRES_DB: idea_os
    ports:
      - "5432:5432"
    volumes:
      - idea_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea_os -d idea_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://idea_os:idea_os@postgres:5432/idea_os
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    volumes:
      - ./app:/app/app

volumes:
  idea_os_postgres_data:
