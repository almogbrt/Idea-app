name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: ruff check app tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: idea_os
          POSTGRES_PASSWORD: idea_os
          POSTGRES_DB: idea_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idea_os -d idea_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://idea_os:idea_os@localhost:5432/idea_os_test
      TEST_DATABASE_URL: postgresql+asyncpg://idea_os:idea_os@localhost:5432/idea_os_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      TOKEN_ENCRYPTION_KEY: "J6VNPH3-V3w5kXAs74eDXrGwyHkd5M2e1Bj959OqMO8="
      JWT_SIGNING_KEY: "ci-signing-key-not-for-production-use-only"
      ANTHROPIC_API_KEY: "sk-ci-placeholder"
      OPENAI_API_KEY: "sk-ci-placeholder"
      GOOGLE_OAUTH_CLIENT_ID: "ci-placeholder"
      GOOGLE_OAUTH_CLIENT_SECRET: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: Enable pgvector extension
        run: |
          PGPASSWORD=idea_os psql -h localhost -U idea_os -d idea_os_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: idea-os:ci

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive deploy/terraform
