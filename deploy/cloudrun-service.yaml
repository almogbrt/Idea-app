# Cloud Run service manifest (declarative deploy via `gcloud run services replace`).
# Placeholders (PROJECT_ID, REGION, IMAGE_TAG) are filled in by deploy.sh —
# this file is the source of truth for runtime configuration.
#
# Postgres (Neon) and Redis (Upstash) are external, internet-reachable
# services over TLS — no Cloud SQL socket, no VPC connector needed. The
# `idea-os-database-url` / `idea-os-redis-url` secrets already hold full
# connection strings (deploy/terraform derives them from your
# neon_database_url / upstash_redis_url variables).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: idea-os-edith
  labels:
    app: idea-os
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      # Least-privilege identity created by deploy/terraform (service_accounts.tf)
      # — omitting this would fall back to the default, overly-broad compute SA.
      serviceAccountName: idea-os-edith-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 40
      # A multi-tool-call Edith command can chain several LLM + Google API round
      # trips (bounded by MAX_TOOL_ITERATIONS); 60s was too tight for that.
      timeoutSeconds: 300
      containers:
        - image: IMAGE_TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: APP_ENV
              value: "production"
            - name: SECRET_MANAGER_BACKEND
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "PROJECT_ID"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: idea-os-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: idea-os-redis-url
                  key: latest
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-os-token-encryption-key
                  key: latest
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-os-jwt-signing-key
                  key: latest
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-os-anthropic-api-key
                  key: latest
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-os-openai-api-key
                  key: latest
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: idea-os-google-oauth-client-id
                  key: latest
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: idea-os-google-oauth-client-secret
                  key: latest
            - name: GOOGLE_OAUTH_REDIRECT_URI
              value: "https://SERVICE_URL/api/v1/auth/google/callback"
            # Not secret — just wasn't set at all before, silently falling back to
            # the code default ("openid email profile"), which meant production
            # never actually requested Drive/Gmail/Calendar/Sheets access. Full
            # `drive` (not `drive.readonly`) because Edith also creates and shares
            # files, not just reads them.
            - name: GOOGLE_OAUTH_SCOPES
              value: "openid email profile https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/spreadsheets"
            - name: OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: idea-os-owner-email
                  key: latest
            - name: SCHEDULER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: idea-os-scheduler-shared-secret
                  key: latest
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: idea-os-whatsapp-access-token
                  key: latest
            - name: WHATSAPP_PHONE_NUMBER_ID
              valueFrom:
                secretKeyRef:
                  name: idea-os-whatsapp-phone-number-id
                  key: latest
            - name: WHATSAPP_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: idea-os-whatsapp-app-secret
                  key: latest
            - name: WHATSAPP_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: idea-os-whatsapp-verify-token
                  key: latest
            - name: WHATSAPP_OWNER_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: idea-os-whatsapp-owner-phone-number
                  key: latest
  traffic:
    - latestRevision: true
      percent: 100
