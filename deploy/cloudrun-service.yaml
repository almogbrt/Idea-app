# Cloud Run service manifest (declarative deploy via `gcloud run services replace`).
# Placeholders (PROJECT_ID, REGION, IMAGE_TAG, connection names) are filled in
# by deploy.sh — this file is the source of truth for runtime configuration.
#
# IMPORTANT — the `idea-os-database-url` secret must use the Cloud SQL Unix
# socket form (the `cloudsql-instances` annotation below mounts the socket,
# it does not give you a TCP host/port to connect to):
#   postgresql+asyncpg://USER:PASSWORD@/DBNAME?host=/cloudsql/PROJECT_ID:REGION:idea-os-postgres
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: idea-os-edith
  labels:
    app: idea-os
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cloudsql-instances: "PROJECT_ID:REGION:idea-os-postgres"
        run.googleapis.com/vpc-access-connector: "idea-os-connector"
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
    spec:
      containerConcurrency: 40
      # A multi-tool-call Edith command can chain several LLM + Google API round
      # trips (bounded by MAX_TOOL_ITERATIONS); 60s was too tight for that.
      timeoutSeconds: 300
      containers:
        - image: IMAGE_TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: APP_ENV
              value: "production"
            - name: SECRET_MANAGER_BACKEND
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "PROJECT_ID"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: idea-os-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: idea-os-redis-url
                  key: latest
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-os-token-encryption-key
                  key: latest
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-os-jwt-signing-key
                  key: latest
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-os-anthropic-api-key
                  key: latest
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-os-openai-api-key
                  key: latest
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: idea-os-google-oauth-client-id
                  key: latest
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: idea-os-google-oauth-client-secret
                  key: latest
            - name: GOOGLE_OAUTH_REDIRECT_URI
              value: "https://SERVICE_URL/api/v1/auth/google/callback"
            - name: OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: idea-os-owner-email
                  key: latest
  traffic:
    - latestRevision: true
      percent: 100
