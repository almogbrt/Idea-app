<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edith — IDEA OS</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Edith</h1>
      <span class="subtitle">Your business operating system</span>
      <div id="auth-status"></div>
    </header>

    <main id="chat-window"></main>

    <form id="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Tell Edith what you need..."
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
